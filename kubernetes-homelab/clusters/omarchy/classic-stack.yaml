apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: classic-stack
  namespace: flux-system
spec:
  interval: 1m
  retryInterval: 30s
  timeout: 15m
  path: ./kubernetes-homelab/manifests/classic-stack
  prune: true
  wait: true
  sourceRef:
    kind: GitRepository
    name: flux-system
