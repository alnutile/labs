apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: database
  namespace: flux-system
spec:
  interval: 5m
  retryInterval: 1m
  timeout: 15m
  path: ./kubernetes-homelab/manifests/database
  prune: true
  wait: true
  sourceRef:
    kind: GitRepository
    name: flux-system
