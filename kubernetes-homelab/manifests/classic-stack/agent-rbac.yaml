apiVersion: v1
kind: ServiceAccount
metadata:
  name: classic-stack-agent-broker
  namespace: classic-stack
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: classic-stack-agent-sandbox
  namespace: classic-stack
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: classic-stack-agent-broker
  namespace: classic-stack
rules:
  - apiGroups: [""]
    resources: [pods]
    verbs: [create, delete, get, list, watch]
  - apiGroups: [""]
    resources: [pods/exec]
    verbs: [create, get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: classic-stack-agent-broker
  namespace: classic-stack
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: classic-stack-agent-broker
subjects:
  - kind: ServiceAccount
    name: classic-stack-agent-broker
    namespace: classic-stack
