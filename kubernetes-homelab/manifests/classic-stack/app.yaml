apiVersion: apps/v1
kind: Deployment
metadata:
  name: classic-stack-scheduler
  namespace: classic-stack
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: classic-stack
      app.kubernetes.io/component: scheduler
  template:
    metadata:
      labels:
        app.kubernetes.io/name: classic-stack
        app.kubernetes.io/component: scheduler
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: scheduler
          image: classic-stack-app
          imagePullPolicy: Always
          args: [php, artisan, schedule:work]
          envFrom:
            - configMapRef:
                name: classic-stack-env
            - secretRef:
                name: classic-stack-secrets
          env:
            - name: DB_HOST
              valueFrom:
                secretKeyRef:
                  name: classic-postgres-app
                  key: host
            - name: DB_PORT
              valueFrom:
                secretKeyRef:
                  name: classic-postgres-app
                  key: port
            - name: DB_USERNAME
              valueFrom:
                secretKeyRef:
                  name: classic-postgres-app
                  key: username
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: classic-postgres-app
                  key: password
          resources:
            requests:
              cpu: 50m
              memory: 96Mi
            limits:
              cpu: 500m
              memory: 384Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
            runAsNonRoot: true
            runAsUser: 33
